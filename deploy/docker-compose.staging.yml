# STAGING ONLY. Layered on top of the production file; it changes nothing but Caddy's certificate setup:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.staging.yml --env-file deploy/.env.staging ...
# PostgreSQL, the gateway, both networks, the volumes and the published ports (80, 443 on Caddy only)
# all come unchanged from deploy/docker-compose.yml. See docs/staging.md.
services:
  caddy:
    environment:
      # Required, with no default, so a certificate authority is never chosen implicitly. deploy/.env.staging.example
      # starts with Let's Encrypt staging; switch to production only after the checks in docs/staging.md pass.
      ACME_CA: ${ACME_CA:?set ACME_CA in deploy/.env.staging (Let's Encrypt staging or production directory URL)}
    volumes:
      # Same mount target as the production file, so this entry replaces deploy/Caddyfile.
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
